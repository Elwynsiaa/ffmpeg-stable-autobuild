name: Build FFmpeg stable
on:
  schedule:
    - cron: '7 11 * * 0'
  workflow_dispatch:
    inputs:
      force_build:
        description: Disable checking for newer commit
        type: boolean
      no_release:
        description: Don't create release
        type: boolean
  watch:
    types: [started]
    
concurrency:
  group: ${{ github.workflow }}
  
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get FFmpeg latest version
        id: ffmpeg-info
        run: |
          version=$(curl -s https://endoflife.date/api/ffmpeg.json | jq -r .[0].latest)
          
          # FFmpeg git tags drop trailing ".0" for initial major/minor releases (e.g. 9.0.0 -> 9.0)
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.0$ ]]; then
            version="${version%.0}"
          fi
          
          echo "version=$version" >> $GITHUB_OUTPUT
          
      - name: Get ${{ vars.FWBH_REPOSITORY_OWNER }}/ffmpeg-windows-build-helpers latest commit
        id: ffmpeg-helper-info
        run: |
          git_owner=${{ vars.FWBH_REPOSITORY_OWNER }}
          git_sha=$(gh api repos/$git_owner/ffmpeg-windows-build-helpers/commits/master -q .sha)
          echo "git-owner=$git_owner" >> $GITHUB_OUTPUT
          echo "git-sha=$git_sha" >> $GITHUB_OUTPUT
          echo "git-sha-short=${git_sha::7}" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ github.token }}
          
      - name: Get ffmpeg-stable-autobuild latest build
        id: ffmpeg-autobuild-info
        run: |
          if ! tag_name=$(gh api repos/$GITHUB_REPOSITORY/releases/latest -q .tag_name 2>/dev/null); then
            echo "No previous release found."
            echo "version=" >> $GITHUB_OUTPUT
            echo "helper-git-sha=" >> $GITHUB_OUTPUT
          else
            echo "version=${tag_name:25}" >> $GITHUB_OUTPUT
            echo "helper-git-sha=${tag_name:17:7}" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
          
      - name: Check if there is newer version or commit
        id: check-build
        if: '! inputs.force_build'
        run: |
          if [[ "${{ steps.ffmpeg-info.outputs.version }}" != "${{ steps.ffmpeg-autobuild-info.outputs.version }}" ]] || \
             [[ "${{ steps.ffmpeg-helper-info.outputs.git-sha-short }}" != "${{ steps.ffmpeg-autobuild-info.outputs.helper-git-sha }}" ]]; then
            echo "run_build=true" >> $GITHUB_OUTPUT
          else
            echo "run_build=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Generate release tag timestamp
        id: generate-tag
        run: |
          echo "build-tag=$(date +'%Y-%m-%d-%H-%M')" >> $GITHUB_OUTPUT
          echo "run-date=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT
          
    outputs:
      version: ${{ steps.ffmpeg-info.outputs.version }}
      helper-git-owner: ${{ steps.ffmpeg-helper-info.outputs.git-owner }}
      helper-git-sha: ${{ steps.ffmpeg-helper-info.outputs.git-sha }}
      helper-git-sha-short: ${{ steps.ffmpeg-helper-info.outputs.git-sha-short }}
      run_build: ${{ steps.check-build.outputs.run_build }}
      build-tag: ${{ steps.generate-tag.outputs.build-tag }}
      run-date: ${{ steps.generate-tag.outputs.run-date }}
      
  build:
    needs: check
    if: needs.check.outputs.run_build == 'true' || inputs.force_build
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        
    steps:
      - name: Free up runner disk space
        run: |
          echo "Freeing up disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af
          sudo docker volume prune -f
          echo "Disk space reclaimed!"

      - name: Checkout ${{ needs.check.outputs.helper-git-owner }}/ffmpeg-windows-build-helpers
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.check.outputs.helper-git-owner }}/ffmpeg-windows-build-helpers
          ref: ${{ needs.check.outputs.helper-git-sha }}
          persist-credentials: false

      - name: Patch ffmpeg-windows-build-helpers scripts
        run: |
          # 1. Fix AOMedia toolchain move
          sed -i 's|../build/cmake/toolchains|../cmake/toolchains|g' cross_compile_ffmpeg.sh
          
          # 2. Intercept downloaded secondary GCC script and patch Savannah URLs to use GitHub's GCC mirror
          sed -i 's|download_gcc_build_script \$zeranoe_script_name|download_gcc_build_script \$zeranoe_script_name; sed -i -E "s#https?://[^\"'\'' ]*savannah\.gnu\.org[^\"'\'' ]*config\.guess[^\"'\'' ]*#https://raw.githubusercontent.com/gcc-mirror/gcc/master/config.guess#g" \$zeranoe_script_name; sed -i -E "s#https?://[^\"'\'' ]*savannah\.gnu\.org[^\"'\'' ]*config\.sub[^\"'\'' ]*#https://raw.githubusercontent.com/gcc-mirror/gcc/master/config.sub#g" \$zeranoe_script_name|g' cross_compile_ffmpeg.sh

          # 3. Patch local copies in patches folder
          find . -type f -name "*mingw-w64-build*" -exec sed -i -E 's#https?://[^"'\'']*savannah\.gnu\.org[^"'\'']*config\.guess[^"'\'']*#https://raw.githubusercontent.com/gcc-mirror/gcc/master/config.guess#g' {} + || true
          find . -type f -name "*mingw-w64-build*" -exec sed -i -E 's#https?://[^"'\'']*savannah\.gnu\.org[^"'\'']*config\.sub[^"'\'']*#https://raw.githubusercontent.com/gcc-mirror/gcc/master/config.sub#g' {} + || true

          # 4. Fix LAME: remove -fstack-clash-protection, disable decoder/frontend, and copy headers to include/lame/
          sed -i 's|generic_configure "--enable-nasm --enable-libmpg123"|sed -i "s/-fstack-clash-protection//g" configure 2>/dev/null \|\| true; generic_configure "--enable-nasm --disable-decoder --disable-frontend"; mkdir -p $mingw_w64_x86_64_prefix/include/lame; cp -f include/lame.h $mingw_w64_x86_64_prefix/include/lame/ 2>/dev/null \|\| true; cp -f include/lame.h $mingw_w64_x86_64_prefix/include/ 2>/dev/null \|\| true|g' cross_compile_ffmpeg.sh

          # 5. Inject -lm into FFmpeg configure probe for libmp3lame right inside the FFmpeg source directory
          sed -i 's|frei0r_load-shared-libraries-dynamically.diff|frei0r_load-shared-libraries-dynamically.diff\n  sed -i "s/-lmp3lame/-lmp3lame -lm/g" configure|g' cross_compile_ffmpeg.sh

          # 6. Update libidn2 to 2.3.7 and disable docs (fixes Automake version mismatch crash)
          sed -i 's|https://ftp.gnu.org/gnu/libidn/libidn2-2.3.0.tar.gz|https://ftp.gnu.org/gnu/libidn/libidn2-2.3.7.tar.gz libidn2-2.3.7 "--disable-doc"|g' cross_compile_ffmpeg.sh

      - name: Install APT dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ragel cvs yasm pax nasm gperf autogen autoconf-archive gcc-multilib g++-multilib

      - name: Install pip dependencies
        run: sudo -H pip3 -qq install meson ninja
        
      - name: Create fallback headers for MinGW
        run: |
          mkdir -p ${{ github.workspace }}/fallback_headers/lame
          cat << 'EOF' > ${{ github.workspace }}/fallback_headers/timeapi.h
          #ifndef _TIMEAPI_H_
          #define _TIMEAPI_H_
          #include <windows.h>
          #include <mmsystem.h>
          #endif
          EOF
          cat << 'EOF' > ${{ github.workspace }}/fallback_headers/lame/lame.h
          #ifndef _FALLBACK_LAME_LAME_H_
          #define _FALLBACK_LAME_LAME_H_
          #include <lame.h>
          #endif
          EOF
          
      - name: Compile FFmpeg ${{ needs.check.outputs.version }} using ffmpeg-windows-build-helpers ${{ needs.check.outputs.helper-git-sha-short }}
        run: ./cross_compile_ffmpeg.sh --cflags="-I${{ github.workspace }}/fallback_headers" --ffmpeg-git-checkout-version=n${{ needs.check.outputs.version }} --gcc-cpu-count=$(nproc) --disable-nonfree=n --sandbox-ok=y --compiler-flavors=win64
          
      - name: Upload FFmpeg binaries
        if: '! inputs.no_release'
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-win64
          path: |
            sandbox/win64/ffmpeg_git_with_fdk_aac_n${{ needs.check.outputs.version }}/ffmpeg.exe
            sandbox/win64/ffmpeg_git_with_fdk_aac_n${{ needs.check.outputs.version }}/ffprobe.exe
            sandbox/win64/ffmpeg_git_with_fdk_aac_n${{ needs.check.outputs.version }}/ffplay.exe
          if-no-files-found: error
          retention-days: 1
          
  archive:
    permissions:
      contents: read
    needs: [check, build]
    if: needs.check.outputs.run_build == 'true' || inputs.force_build
    runs-on: ubuntu-latest
        
    steps:
      - name: Download FFmpeg binaries
        uses: actions/download-artifact@v8
        with:
          name: ffmpeg-win64
          
      - name: Create LICENSE
        run: |
          echo "This version of ffmpeg has nonfree parts compiled in." >> LICENSE
          echo "Therefore it is not legally redistributable." >> LICENSE
          
      - name: 7-Zip FFmpeg binaries
        run: 7z a -mx9 ffmpeg-${{ needs.check.outputs.version }}-${{ needs.check.outputs.helper-git-sha-short }}-win64-nonfree.7z ff{mpeg,probe,play}.exe LICENSE
          
      - name: Upload FFmpeg archive
        if: '! inputs.no_release'
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-archive-win64
          path: ffmpeg-${{ needs.check.outputs.version }}-${{ needs.check.outputs.helper-git-sha-short }}-win64-nonfree.7z
          retention-days: 1
          compression-level: 0
          
  release:
    needs: [check, build, archive]
    if: (needs.check.outputs.run_build == 'true' || inputs.force_build) && !inputs.no_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download FFmpeg archives
        uses: actions/download-artifact@v8
        with:
          pattern: ffmpeg-archive-*
          merge-multiple: true
          
      - name: Release FFmpeg archives
        run: |
          gh release create "${{ needs.check.outputs.build-tag }}-${{ needs.check.outputs.helper-git-sha-short }}-${{ needs.check.outputs.version }}" \
          ffmpeg-${{ needs.check.outputs.version }}-${{ needs.check.outputs.helper-git-sha-short }}-win64-nonfree.7z \
          -n "FFmpeg nonfree ${{ needs.check.outputs.version }} build triggered at ${{ needs.check.outputs.run-date }}
          Using ${{ needs.check.outputs.helper-git-owner }}/ffmpeg-windows-build-helpers git-${{ needs.check.outputs.helper-git-sha }}" \
          -t "${{ needs.check.outputs.version }} ${{ needs.check.outputs.run-date }} ${{ needs.check.outputs.helper-git-sha-short }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
